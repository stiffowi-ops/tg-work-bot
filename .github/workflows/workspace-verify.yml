name: Workspace release verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Go tests and race detector
        run: go test -race -v ./...
      - name: Go vet and release binary
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/workhub .
      - name: Docker build
        run: docker build -t workhub-verification .
      - name: Docker persistent storage smoke test
        run: |
          set -eu
          docker volume create workhub-storage-test
          trap 'docker rm -f workhub-storage-test >/dev/null 2>&1 || true; docker volume rm workhub-storage-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name workhub-storage-test -e BOT_TOKEN=test-token -e WORK_CHAT_ID=-100123 -v workhub-storage-test:/app/data workhub-verification
          for i in $(seq 1 30); do
            if docker logs workhub-storage-test 2>&1 | grep -q 'storage ready; DATA_DIR=/app/data'; then break; fi
            sleep 1
          done
          docker logs workhub-storage-test 2>&1 | grep 'storage ready; DATA_DIR=/app/data'
          docker exec -u workhub workhub-storage-test sh -c 'mkdir -p "$DATA_DIR/data/projects/calendar"; echo retained > "$DATA_DIR/data/projects/calendar/.storage-test"'
          docker rm -f workhub-storage-test
          docker run -d --name workhub-storage-test -e BOT_TOKEN=test-token -e WORK_CHAT_ID=-100123 -v workhub-storage-test:/app/data workhub-verification
          for i in $(seq 1 30); do
            if docker logs workhub-storage-test 2>&1 | grep -q 'storage ready; DATA_DIR=/app/data'; then break; fi
            sleep 1
          done
          docker logs workhub-storage-test 2>&1 | grep 'storage ready; DATA_DIR=/app/data'
          docker exec -u workhub workhub-storage-test sh -c 'test "$(cat "$DATA_DIR/data/projects/calendar/.storage-test")" = retained'
      - name: JavaScript syntax
        run: for f in web/components/*.js; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test runner
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          command -v google-chrome >/dev/null || python -m playwright install chrome
          google-chrome --version
          command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffprobe -v error -show_entries stream=codec_name,profile,pix_fmt,width,height -show_entries format=duration,size -of json demo/overview.mp4
      - name: Browser integration tests
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" -keyout /tmp/fixture.key -out /tmp/fixture.crt
          FIXTURE_CERT=/tmp/fixture.crt FIXTURE_KEY=/tmp/fixture.key RUN_BROWSER_FIXTURE=1 go test -run '^TestBrowserFixture$' -timeout 8m . > /tmp/fixture.log 2>&1 &
          trap 'cat /tmp/fixture.log' EXIT
          for i in $(seq 1 60); do curl -kfsS https://127.0.0.1:18080/ >/dev/null && break; sleep 1; done
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-screenshots
          path: test-screenshots/
          if-no-files-found: warn
